name: Build and emulate three DS4 test firmwares
on:
  push:
    branches: [main, jsm-calibration, ds4-fix35]
    paths: ['tools/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ds4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified ARM assembler and pinned test tools
        env:
          FIRMWARE_TOOLS_DIR: ${{ runner.temp }}/firmware-tools
        run: bash tools/setup_firmware_env.sh
      - name: Rebuild all variants and execute ARM tests
        run: |
          export PATH="${{ runner.temp }}/firmware-tools/gcc-arm-none-eabi-9-2019-q4-major/bin:$PATH"
          python tools/build_fix35.py
          "${{ runner.temp }}/firmware-tools/venv/bin/python" -m unittest discover -s tests -v
          git diff --exit-code -- releases/ds4-fix35
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-ds4-fix35-three-variants
          path: releases/ds4-fix35/
